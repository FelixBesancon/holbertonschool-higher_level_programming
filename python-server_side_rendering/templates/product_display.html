<!doctype html>
<html>
<head>
    <title>Products List</title>
</head>
<body>
    {% include "header.html" %}

    {% if error %}
        <p>{{ error }}</p>
    {% else %}
        <table>
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
            {% for product in products %}
            <tr>
                <td>{{ product["name"] }}</td>
                <td>{{ product["category"] }}</td>
                <td>{{ product["price"] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% endif %}

    {% include "footer.html" %}
</body>
</html>
